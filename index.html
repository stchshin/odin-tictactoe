<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <p id="title">Tic Tac Toe</p>
    <div class="container">
        <div class="gameGrid" id="grid0"></div>
        <div class="gameGrid" id="grid1"></div>
        <div class="gameGrid" id="grid2"></div>
        <div class="gameGrid" id="grid3"></div>
        <div class="gameGrid" id="grid4"></div>
        <div class="gameGrid" id="grid5"></div>
        <div class="gameGrid" id="grid6"></div>
        <div class="gameGrid" id="grid7"></div>
        <div class="gameGrid" id="grid8"></div>
        <div class="gameGrid" id="grid9"></div>
    </div>
    <div class="playerInfo">
        <p id="playerNames">Cinnamon vs Roll</p>
        <p id="turn">Cinnamon's turn</p>
        <p id="result">Cinnamon wins!</p>
        <button>Play Again</button>
    </div>
    <script>
        const game = (function() {
            let gameboard = [];
            let player = 'player1';
            document.querySelector('.container')

            const initialise = function() {
                for (let i = 0; i < 9; i++) {
                    gameboard[i] = ['*', 'free'];
                }
            }

            const turn = () => (player);
            const turnSwitch = () => {
                if (player == 'player1') {
                    player = 'player2';
                } else {
                    player = 'player1';
                }
            }

            const player1Add = (index) => {
                gameboard[index][0] = 'X';
                gameboard[index][1] = 'locked';
            }
            const player2Add = (index) => {
                gameboard[index][0] = 'O';
                gameboard[index][1] = 'locked';
            }

            const status = (index) => (gameboard[index][1]);
            const currentBoard = () => (gameboard);

            return { initialise, turn, turnSwitch, player1Add, player2Add, status, currentBoard };
        })

        let newGame = game();
        newGame.initialise();

        document.querySelectorAll(".gameGrid").forEach(grid => {
            grid.addEventListener('click', function() {
                let gridId = Number(grid.id.slice(-1));
                if (newGame.status(gridId) == 'locked') {
                } else if (newGame.turn() == 'player1') {
                    grid.textContent = 'X';
                    newGame.player1Add(gridId);
                    newGame.turnSwitch();
                } else {
                    grid.textContent = 'O';
                    newGame.player2Add(gridId);
                    newGame.turnSwitch();
                }
                
            })
        })
    </script>
</body>
</html>
